name: Test Browser Scraper

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

# Prevent concurrent runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PLAYWRIGHT_BROWSERS_PATH: /tmp/playwright-browsers
  PYTEST_TIMEOUT: 300

jobs:
  test-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies for Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libasound2 \
            libatspi2.0-0 \
            libxshmfence1 \
            xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium
          # Optional: install other browsers if needed
          # playwright install firefox webkit

      - name: Install Playwright system deps (auto)
        run: playwright install-deps chromium

      - name: Run linting (optional)
        run: |
          pip install flake8 black
          flake8 browser_scraper.py --max-line-length=120 --ignore=E203,W503
          black --check browser_scraper.py || true

      - name: Run unit tests (if you have them)
        run: |
          pytest tests/ -v --timeout=${{ env.PYTEST_TIMEOUT }} || true

      - name: Run CI-safe scraper test
        env:
          # CAPTCHA_API_KEY is optional - only set if testing CAPTCHA flows
          CAPTCHA_API_KEY: ${{ secrets.CAPTCHA_API_KEY }}
          TEST_MODE: "true"
        run: |
          python scripts/run_ci_test.py

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-test-output
          path: |
            *.json
            *.csv
            *.log
            html_*.html
          retention-days: 7

      - name: Report results
        if: always()
        run: |
          echo "## ✅ Scraper Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Python: ${{ env.PYTHON_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- OS: ubuntu-latest" >> $GITHUB_STEP_SUMMARY
          echo "- Playwright: Chromium installed" >> $GITHUB_STEP_SUMMARY
          if [ -f "scraper.log" ]; then
            echo "<details><summary>📋 Log excerpt</summary>" >> $GITHUB_STEP_SUMMARY
            tail -50 scraper.log >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi
