name: Test Browser Scraper

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PLAYWRIGHT_BROWSERS_PATH: /tmp/playwright-browsers
  PYTEST_TIMEOUT: 300

jobs:
  test-scraper:
    runs-on: ubuntu-latest  # Currently ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # 🔧 FIXED: Use playwright's built-in dependency installer
      # This automatically handles Ubuntu version differences
      - name: Install Playwright and browsers
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      # Optional: If you need manual system deps (usually NOT needed with install-deps)
      # - name: Install system dependencies (Ubuntu 24.04 compatible)
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y \
      #       libnss3 \
      #       libatk-bridge2.0-0 \
      #       libdrm2 \
      #       libxkbcommon0 \
      #       libxcomposite1 \
      #       libxdamage1 \
      #       libxrandr2 \
      #       libgbm1 \
      #       libasound2t64 \          # ← Fixed: was libasound2
      #       libatspi2.0-0 \
      #       libxshmfence1 \
      #       xvfb

      - name: Run linting (optional)
        run: |
          pip install flake8 black
          flake8 browser_scraper.py --max-line-length=120 --ignore=E203,W503 || true
          black --check browser_scraper.py || true

      - name: Run CI-safe scraper test
        env:
          CAPTCHA_API_KEY: ${{ secrets.CAPTCHA_API_KEY }}
          TEST_MODE: "true"
        run: |
          python scripts/run_ci_test.py

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-test-output-${{ github.run_number }}
          path: |
            *.json
            *.csv
            *.log
            html_*.html
            ci_test_output.*
          retention-days: 7
          if-no-files-found: warn

      - name: Report results
        if: always()
        run: |
          echo "## 🧪 Scraper Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner**: ${{ runner.os }} / ${{ runner.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Python**: ${{ env.PYTHON_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Playwright**: Chromium" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "scraper.log" ]; then
            echo "<details><summary>📋 Last 30 log lines</summary>" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -30 scraper.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi
